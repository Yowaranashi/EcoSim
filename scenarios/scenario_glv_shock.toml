scenario_id = "scenario_glv_shock"
seed = 42
model = "glv"
integrator = "rk4"
dt = 0.1
stop_at_tick = 100
extinction_threshold = 0.1
environmental_noise = 0.0
requires = ["simulation_world", "recorder"]

species = ["grass", "rabbit", "fox"]
initial_state = [100.0, 30.0, 5.0]
growth_rates = [0.4, 0.2, -0.1]

interaction_matrix = [
  [-0.01, -0.02,  0.00],
  [ 0.01, -0.01, -0.03],
  [ 0.00,  0.02, -0.01]
]

schedule = [
  { tick = 20, command = "apply_shock", target = "rabbit", value = -10.0 },
  { tick = 50, command = "set_param", name = "growth.rabbit", value = 0.1 }
]
