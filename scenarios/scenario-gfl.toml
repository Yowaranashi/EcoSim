  [-0.01, -0.02,  0.00],
  [ 0.01, -0.01, -0.03],
  [ 0.00,  0.02, -0.01]
]

requires = ["simulation_world", "recorder"]

schedule = [
  { tick = 20, command = "apply_shock", target = "rabbit", strength = -10.0 },
  { tick = 50, command = "set_param", name = "growth.rabbit", value = 0.1 }
]
