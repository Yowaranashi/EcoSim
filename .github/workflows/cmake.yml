name: CMake

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc-release

      - name: Build
        run: cmake --build --preset build-windows-msvc-release

      - name: Test
        run: ctest --preset test-windows-msvc-release --output-on-failure
